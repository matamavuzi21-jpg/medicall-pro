name: Supabase Keep Alive

on:
  schedule:
    # Tous les mardis et vendredis à 8h00 UTC
    - cron: '0 8 * * 2,5'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          curl -X GET "https://iikqndrpufjmgzkesgvm.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
